<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teacher guide: Performance Assessment</title>
<style>
:root{--paper:#eef1f4;--card:#fff;--ink:#16222b;--mute:#6b7f8c;--line:#d9e1e6;--acc:#0d5f60;--soft:#dfeceb;--nav:#0f1c23;--gold:#a8720f;--l5:#155e45;--l3:#2f6f96;--l1:#a33a3a;
 --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0b1216;--card:#111b21;--ink:#e3edf1;--mute:#8099a5;--line:#22333b;--acc:#4ab5ad;--soft:#122e2f;--nav:#080f13}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.6 "Public Sans","Avenir Next","Geeza Pro","Segoe UI",Tahoma,system-ui,sans-serif;display:flex;flex-direction:column;padding-top:var(--safe-t);padding-bottom:var(--safe-b)}
.stage{flex:1;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:40px;align-items:center;max-width:1100px;width:100%;margin:0 auto;padding:24px;overflow:auto}
@media(max-width:800px){.stage{grid-template-columns:1fr;gap:20px}}
.txt h1{font-size:clamp(1.7rem,4vw,2.6rem);line-height:1.15;margin:0 0 12px;letter-spacing:-.02em}
.txt p{color:var(--mute);margin:0 0 14px;max-width:46ch}
.txt ol{padding-inline-start:20px;margin:0;display:grid;gap:8px}
.txt li b{color:var(--acc)}
.step{display:inline-block;font-size:14px;font-weight:600;color:var(--acc);margin-bottom:8px}
.slide{display:none}.slide.on{display:contents}
.mock{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 24px -16px rgba(18,35,44,.45);overflow:hidden;font-size:14px}
.bar{background:var(--nav);color:#b9ccd5;padding:8px 14px;font-size:13px;display:flex;gap:6px;align-items:center}
.bar i{width:9px;height:9px;border-radius:50%;background:#2c4350}
.body{padding:16px;display:grid;gap:10px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 12px;border:1px solid var(--line);border-radius:9px}
.btn{display:inline-block;padding:7px 14px;border-radius:8px;border:1px solid var(--line);font-weight:600;background:var(--card)}
.btn.p{background:var(--acc);color:#fff;border-color:var(--acc)}
.tag{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--soft);color:var(--acc)}
.tag.a{background:#f6e2e2;color:var(--l1)}
.nums{display:flex;gap:6px}.nums span{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);display:grid;place-items:center;font-weight:600}
.nums span.s{background:var(--acc);color:#fff;border-color:var(--acc)}
.hl{outline:3px solid var(--gold);outline-offset:2px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{outline-color:transparent}}
@media(prefers-reduced-motion:reduce){.hl{animation:none}}
.nav{display:flex;flex-wrap:wrap;gap:6px}.nav span{padding:5px 11px;border-radius:7px;background:var(--soft);color:var(--acc);font-weight:600;font-size:13px}
.chain{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-weight:600}.chain b{color:var(--mute)}
.cap{background:var(--nav);color:#e3edf1;text-align:center;padding:12px 20px;min-height:52px;font-size:15px}
.ctl{display:flex;gap:10px;align-items:center;justify-content:center;padding:10px;flex-wrap:wrap}
.ctl button{font:inherit;font-weight:600;padding:8px 16px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.ctl button.p{background:var(--acc);border-color:var(--acc);color:#fff}
.ctl button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.prog{height:4px;background:var(--line)}.prog div{height:100%;width:0;background:var(--acc);transition:width .4s}
.ctl label{font-size:14px;color:var(--mute);display:flex;gap:6px;align-items:center}
</style>
</head>
<body>
<div class="prog"><div id="pg"></div></div>
<main class="stage" id="stage"></main>
<div class="cap" id="cap" aria-live="polite"></div>
<div class="ctl">
  <button id="prev" aria-label="Previous slide">Back</button>
  <button id="play" class="p">Play as video</button>
  <button id="next" aria-label="Next slide">Next</button>
  <select id="lang" aria-label="Language" style="font:inherit;font-size:14px;padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)"><option value="en">English</option><option value="ar">العربية</option></select><label><input type="checkbox" id="voice" checked> <span id="lvo">Voice-over</span></label><select id="vsel" aria-label="English voice" style="font:inherit;font-size:14px;padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);max-width:200px"></select><label><span id="lsp">Speed</span> <input type="range" id="rate" min="0.8" max="1.2" step="0.05" value="0.95"></label>
  <span id="count" style="color:var(--mute);font-size:14px"></span><div id="vnote" style="flex-basis:100%;text-align:center;color:var(--mute);font-size:13px"></div>
</div>

];
const UI={en:{back:'Back',play:'Play as video',pause:'Pause',next:'Next',vo:'Voice-over',sp:'Speed',title:'Teacher guide: Performance Assessment',nov:''},
 ar:{back:'السابق',play:'تشغيل كفيديو',pause:'إيقاف مؤقت',next:'التالي',vo:'التعليق الصوتي',sp:'السرعة',title:'دليل المعلم: تقييم الأداء',nov:'لا يوجد صوت عربي على هذا الجهاز، لذلك ستتقدم الشرائح تلقائيًا مع النص فقط. على جهاز Mac أضف صوتًا عربيًا من إعدادات النظام ← إمكانية الوصول ← المحتوى المنطوق.'}};
const st=document.getElementById('stage');
const $=id=>document.getElementById(id);
let i=0,playing=false,timer=null,run=0,voices=[],lang='en';
const X=n=>lang==='ar'?AR[n]:S[n], VOt=n=>lang==='ar'?VO_AR[n]:VO[n];
function render(){st.dir=lang==='ar'?'rtl':'ltr';
 st.innerHTML=S.map((s,n)=>{const x=X(n);return `<section class="slide" id="s${n}"><div class="txt" dir="${lang==='ar'?'rtl':'ltr'}" lang="${lang}">${x.s?`<span class="step">${x.s}</span>`:''}<h1>${x.t}</h1><p>${x.p}</p><ol>${x.list.map(l=>`<li>${l}</li>`).join('')}</ol></div><div class="mock" dir="ltr" lang="en" role="img" aria-label="Illustration">${s.mock}</div></section>`}).join('');
 const u=UI[lang];$('prev').textContent=u.back;$('next').textContent=u.next;$('play').textContent=playing?u.pause:u.play;$('lvo').textContent=u.vo;$('lsp').textContent=u.sp;document.title=u.title;document.documentElement.lang=lang;$('cap').dir=lang==='ar'?'rtl':'ltr'}
function loadVoices(){if(!window.speechSynthesis){voices=[];return}
 voices=speechSynthesis.getVoices().filter(v=>new RegExp('^'+lang,'i').test(v.lang));
 $('vsel').innerHTML=voices.map((v,k)=>`<option value="${k}">${v.name} (${v.lang})</option>`).join('');
 const k=voices.findIndex(v=>/Samantha|Daniel|Karen|Google US English|Google UK English|Aria|Jenny|Natural|Majed|Maged|Tarik|Laila|Hoda|Salma/i.test(v.name));if(k>=0)$('vsel').value=k;
 $('vnote').textContent=voices.length?'':UI[lang].nov}
if(window.speechSynthesis){speechSynthesis.onvoiceschanged=loadVoices}else{$('voice').checked=false;$('voice').disabled=true}
function speak(text,my,done){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);const v=voices[$('vsel').value];
 if(v){u.voice=v;u.lang=v.lang}else u.lang=lang==='ar'?'ar-SA':'en-US';u.rate=+$('rate').value;
 const fin=()=>{if(my===run)done()};u.onend=fin;u.onerror=fin;speechSynthesis.speak(u)}
function advance(my){if(playing&&my===run)timer=setTimeout(()=>{if(i<S.length-1)show(i+1);else stop()},1200)}
function show(n,silent){i=Math.max(0,Math.min(S.length-1,n));document.querySelectorAll('.slide').forEach((e,k)=>e.classList.toggle('on',k===i));
 $('cap').textContent=X(i).cap;$('count').textContent=`${i+1} / ${S.length}`;$('pg').style.width=((i+1)/S.length*100)+'%';
 if(silent)return;const my=++run;clearTimeout(timer);if(window.speechSynthesis)speechSynthesis.cancel();
 if($('voice').checked&&voices.length)speak(VOt(i),my,()=>advance(my));
 else if(playing)timer=setTimeout(()=>advance(my),Math.max(6000,VOt(i).length*65))}
function stop(){playing=false;run++;clearTimeout(timer);if(window.speechSynthesis)speechSynthesis.cancel();$('play').textContent=UI[lang].play}
$('play').onclick=()=>{if(playing)return stop();playing=true;if(i===S.length-1)i=0;$('play').textContent=UI[lang].pause;show(i)};
$('next').onclick=()=>{stop();show(i+1)};$('prev').onclick=()=>{stop();show(i-1)};
$('vsel').onchange=()=>{if(playing||$('voice').checked)show(i)};
$('lang').onchange=()=>{stop();lang=$('lang').value;render();loadVoices();show(i,true)};
addEventListener('keydown',e=>{if(e.key==='ArrowRight'){stop();show(i+1)}if(e.key==='ArrowLeft'){stop();show(i-1)}if(e.key===' '&&!/BUTTON|SELECT|INPUT/.test(e.target.tagName)){e.preventDefault();$('play').click()}});
render();loadVoices();show(0,true);
</script>
</body>
</html>
